x-superset-common: &superset-common
  image: apache/superset:6.1.0
  user: root  # Cần thiết để docker-bootstrap.sh tự động cài psycopg2 driver
  environment:
    # Fix lỗi lệch 7 tiếng của biến 'now' trong Advanced Filter (ép OS Timezone về GMT+7)
    TZ: Asia/Bangkok
    # Map các biến từ .env tổng sang format mà superset_config.py kỳ vọng
    DATABASE_DIALECT: postgresql
    DATABASE_USER: ${SUPERSET_DB_USER}
    DATABASE_PASSWORD: ${SUPERSET_DB_PASSWORD}
    DATABASE_HOST: postgres_db
    DATABASE_PORT: 5432
    DATABASE_DB: ${SUPERSET_DB_NAME}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_CELERY_DB: 0
    REDIS_RESULTS_DB: 1
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    SUPERSET_LOG_LEVEL: ${SUPERSET_LOG_LEVEL:-INFO}
  volumes:
    - type: bind
      source: ./superset/superset_config.py
      target: /app/pythonpath/superset_config.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./superset/requirements-local.txt
      target: /app/docker/requirements-local.txt
      read_only: true
      bind:
        create_host_path: false
    - superset_home:/app/superset_home
  networks:
    - meteo_network

services:
  postgres_db:
    container_name: postgres_container
    image: postgres:16.16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      # Superset credentials — cần để init_dbs.sh tạo superset_db và phân quyền
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/scripts/init_dbs.sh:/docker-entrypoint-initdb.d/init_dbs.sh:ro
      - ./src/scripts/migrations/001_historical_columns.sql:/docker-entrypoint-initdb.d/migration_001_historical_columns.sql:ro
      - ./src/scripts/migrations/002_bot_preferences_and_delivery.sql:/docker-entrypoint-initdb.d/migration_002_bot_preferences_and_delivery.sql:ro
    networks:
      - meteo_network
    # INFRA-1 FIX: Thêm healthcheck để đảm bảo Postgres thực sự READY trước khi
    # Airflow container khởi động. depends_on mặc định chỉ đợi container start,
    # không đợi Postgres accept connections → airflow db migrate chạy quá sớm sẽ fail.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow:
    container_name: airflow_container
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python3 /opt/airflow/metadata_url.py
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
      AIRFLOW__CORE__AUTH_MANAGER: 'airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager'
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-${AIRFLOW_API_SECRET_KEY}}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      DBT_TARGET_SCHEMA: ${DBT_TARGET_SCHEMA:-silver_layer}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # QUALITY-6 FIX: Set biến rõ ràng để logger.py phát hiện môi trường Docker
      # thay vì suy luận từ AIRFLOW_HOME (có thể set cả khi cài Airflow local).
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./dbt-transform:/opt/airflow/dbt-transform
      - ./.dbt/profiles.yml:/home/airflow/.dbt/profiles.yml:ro
    depends_on:
      postgres_db:
        # INFRA-1 FIX: Đợi đến khi postgres_db healthy (không chỉ started).
        condition: service_healthy
    networks:
      - meteo_network
    restart: unless-stopped
    command: ["bash", "/opt/airflow/start.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=5)); raise SystemExit(any(data.get(component, {}).get('status') != 'healthy' for component in ('metadatabase', 'scheduler', 'triggerer', 'dag_processor')))"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 90s

  telegram_bot:
    container_name: telegram_bot_container
    build: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./src:/opt/airflow/src
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - meteo_network
    restart: unless-stopped
    command: bash -c "python3 /opt/airflow/src/scripts/telegram_bot.py"

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - meteo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset-init:
    <<: *superset-common
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  superset:
    <<: *superset-common
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  superset-worker:
    <<: *superset-common
    container_name: superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 5s
      retries: 5

  superset-worker-beat:
    <<: *superset-common
    container_name: superset_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-worker:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis:
  superset_home:
networks:
  meteo_network:
    driver: bridge
