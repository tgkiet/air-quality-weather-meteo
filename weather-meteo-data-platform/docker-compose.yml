services:
  postgres_db: 
    container_name: postgres_container
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      # Superset credentials — cần để init_dbs.sh tạo superset_db và phân quyền
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/scripts/init_dbs.sh:/docker-entrypoint-initdb.d/init_dbs.sh
    networks:
      - meteo_network
    # INFRA-1 FIX: Thêm healthcheck để đảm bảo Postgres thực sự READY trước khi
    # Airflow container khởi động. depends_on mặc định chỉ đợi container start,
    # không đợi Postgres accept connections → airflow db migrate chạy quá sớm sẽ fail.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow:
    container_name: airflow_container
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__AUTH_MANAGER: 'airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager'
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # QUALITY-6 FIX: Set biến rõ ràng để logger.py phát hiện môi trường Docker
      # thay vì suy luận từ AIRFLOW_HOME (có thể set cả khi cài Airflow local).
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./dbt-transform:/opt/airflow/dbt-transform
      - ./.env:/opt/airflow/.env:ro
      - ./.dbt/profiles.yml:/home/airflow/.dbt/profiles.yml:ro
    depends_on:
      postgres_db:
        # INFRA-1 FIX: Đợi đến khi postgres_db healthy (không chỉ started).
        condition: service_healthy
    networks:
      - meteo_network
    # Lý do dùng `airflow users list | grep -q`:
    # `airflow users create` trả về exit code 1 khi user đã tồn tại (FabAuthManager).
    # Dùng `users create || true` sẽ nuốt cả lỗi thực sự (DB down, permission denied).
    # Pattern check-then-create là cách duy nhất đúng cho cả 2 trường hợp:
    #   - Lần chạy đầu tiên  : user chưa tồn tại → tạo mới.
    #   - Lần restart tiếp theo: user đã tồn tại → bỏ qua, tiếp tục khởi động.
    #   - DB unreachable      : `users list` fail → toàn bộ command fail → container crash
    #     (đây là hành vi ĐÚNG — không bao giờ khởi động scheduler khi DB chưa sẵn sàng).
    restart: unless-stopped
    command: >
      bash -c "
        airflow db migrate &&
        (airflow users list 2>/dev/null | grep -q -w \"${_AIRFLOW_WWW_USER_USERNAME}\" ||
          airflow users create \
            --username \"${_AIRFLOW_WWW_USER_USERNAME}\" \
            --password \"${_AIRFLOW_WWW_USER_PASSWORD}\" \
            --firstname Kiet --lastname Admin \
            --role Admin \
            --email giakiet.work@gmail.com) &&
        airflow scheduler &
        airflow triggerer &
        airflow dag-processor &
        airflow api-server &
        wait -n
      "

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    networks:
      - meteo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SUPERSET SERVICES (5-Container Architecture from Official Repo)
  # X-superset-common is an anchor to DRY (Don't Repeat Yourself) the configs
  x-superset-common: &superset-common
    image: apache/superset:6.1.0
    env_file: .env
    user: root  # Cần thiết để docker-bootstrap.sh tự động cài psycopg2 driver
    environment:
      # Fix lỗi lệch 7 tiếng của biến 'now' trong Advanced Filter (ép OS Timezone về GMT+7)
      TZ: Asia/Bangkok
      # Map các biến từ .env tổng sang format mà superset_config.py kỳ vọng
      DATABASE_DIALECT: postgresql
      DATABASE_USER: ${SUPERSET_DB_USER}
      DATABASE_PASSWORD: ${SUPERSET_DB_PASSWORD}
      DATABASE_HOST: postgres_db
      DATABASE_PORT: 5432
      DATABASE_DB: ${SUPERSET_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CELERY_DB: 0
      REDIS_RESULTS_DB: 1
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    volumes:
      # Mount CHỈ superset_config.py và requirements-local.txt
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/requirements-local.txt:/app/docker/requirements-local.txt:ro
      - superset_home:/app/superset_home
    networks:
      - meteo_network

  superset-init:
    <<: *superset-common
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  superset:
    <<: *superset-common
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  superset-worker:
    <<: *superset-common
    container_name: superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 5s
      retries: 5

  superset-worker-beat:
    <<: *superset-common
    container_name: superset_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-worker:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis:
  superset_home:
networks:
  meteo_network:
    driver: bridge