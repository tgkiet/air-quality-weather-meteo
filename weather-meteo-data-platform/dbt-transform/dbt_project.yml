name: 'weather_meteo_transform'
version: '1.0.0'
config-version: 2

# Profile name phải khớp với tên khai báo trong file profiles.yml
profile: 'weather_meteo_transform'

# Thư mục chứa model dbt (các file .sql)
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  weather_meteo_transform:
    # Cấu hình Materialization theo Folder (Nguyên tắc OOP - DRY)
    # Quy tắc: Cấu hình ở đây là DEFAULT. File .sql chỉ override khi có lý do đặc biệt.
    staging:
      +materialized: view       # VIEW ảo: nhẹ, nhanh, không tốn dung lượng ổ cứng
    silver:
      +materialized: incremental # INCREMENTAL: Chỉ ghi dữ liệu MỚI, không quét lại lịch sử
      # Post-hook: Tạo Index sau mỗi lần dbt run để tăng tốc JOIN và Incremental MERGE.
      # CREATE INDEX IF NOT EXISTS đảm bảo idempotent — không lỗi khi chạy lại nhiều lần.
      +post-hook:
        - "CREATE INDEX IF NOT EXISTS idx_{{ this.name }}_forecast_time  ON {{ this }}(forecast_time)"
        - "CREATE INDEX IF NOT EXISTS idx_{{ this.name }}_lat_lon        ON {{ this }}(latitude, longitude)"
        - "CREATE INDEX IF NOT EXISTS idx_{{ this.name }}_location_name  ON {{ this }}(location_name)"
    marts:
      +materialized: table       # TABLE vật lý: Tầng Gold được đọc liên tục bởi BI Tools
      +schema: gold_layer        # Tạo schema RIÊNG BIỆT cho Tầng Gold
                                  # Lý do: Phân tách quyền truy cập (RBAC):
                                  #   - Data Engineer: Có quyền vào silver_layer
                                  #   - Data Analyst:  Chỉ được GRANT SELECT vào gold_layer
      # Post-hook: Tạo Index sau mỗi lần dbt run (kể cả full-refresh thay thế TABLE).
      # Superset query thường filter theo forecast_time và group theo location_name.
      +post-hook:
        - "CREATE INDEX IF NOT EXISTS idx_{{ this.name }}_forecast_time  ON {{ this }}(forecast_time)"
        - "CREATE INDEX IF NOT EXISTS idx_{{ this.name }}_lat_lon        ON {{ this }}(latitude, longitude)"
        - "CREATE INDEX IF NOT EXISTS idx_{{ this.name }}_location_name  ON {{ this }}(location_name)"
