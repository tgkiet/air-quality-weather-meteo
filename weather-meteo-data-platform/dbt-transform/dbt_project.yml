name: 'weather_meteo_transform'
version: '1.0.0'
config-version: 2

# Profile name phải khớp với tên khai báo trong file profiles.yml
profile: 'weather_meteo_transform'

# Thư mục chứa model dbt (các file .sql)
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  weather_meteo_transform:
    # Cấu hình Materialization theo Folder (Nguyên tắc OOP - DRY)
    # Quy tắc: Cấu hình ở đây là DEFAULT. File .sql chỉ override khi có lý do đặc biệt.
    staging:
      +materialized: view       # VIEW ảo: nhẹ, nhanh, không tốn dung lượng ổ cứng
    silver:
      +materialized: incremental # INCREMENTAL: Chỉ ghi dữ liệu MỚI, không quét lại lịch sử
      # Index native dbt cho Silver layer
      +indexes:
        - { columns: ["location_name", "execution_date"] }
        - { columns: ["forecast_time", "latitude", "longitude"], unique: true }
    marts:
      +materialized: table       # TABLE vật lý: Tầng Gold được đọc liên tục bởi BI Tools
      +schema: gold_layer        # Tạo schema RIÊNG BIỆT cho Tầng Gold
                                  # Lý do: Phân tách quyền truy cập (RBAC):
                                  #   - Data Engineer: Có quyền vào silver_layer
                                  #   - Data Analyst:  Chỉ được GRANT SELECT vào gold_layer
      # TẠO INDEX TOÀN DIỆN (Natively via dbt) CHO CẢ BI TOOLS (SUPERSET), DBMS VÀ BOT:
      +indexes:
        # 1. Tối ưu cho Superset & Data Analyst (Lọc Time-series hoặc Group by thời gian)
        - { columns: ["forecast_time"] }
        - { columns: ["forecast_time_local"] }
        
        # 2. Tối ưu cho Telegram Bot & Tra cứu cá nhân (Compound Index: Tìm location + Sắp xếp thời gian)
        - { columns: ["location_name", "forecast_time"] }
        
        # 3. Tối ưu cho biểu đồ Bản đồ (Geospatial Map) trên Superset
        - { columns: ["latitude", "longitude"] }
