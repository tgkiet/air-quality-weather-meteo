version: 2

models:
  - name: slv_weather_hourly
    description: >
      Bảng Silver chứa dữ liệu thời tiết đã được bóc tách và làm sạch,
      lưu trữ theo cơ chế Incremental (DISTINCT ON + dbt MERGE).
      Gộp 2 nguồn: stg_weather_hourly (realtime 7 ngày) UNION ALL
      stg_historical_weather (lịch sử backfill từ 2022).
      unique_key = (forecast_time, latitude, longitude).
      Số locations thực tế: 52 locations (từ 52 entries trong config.json).
    columns:
      - name: forecast_time
        description: "Mốc thời gian dự báo (TIMESTAMPTZ — chuẩn UTC, đã shift từ Asia/Bangkok)"
        tests:
          - not_null
      - name: latitude
        description: "Vĩ độ (đã làm tròn 4 chữ số thập phân)"
        tests:
          - not_null
      - name: longitude
        description: "Kinh độ (đã làm tròn 4 chữ số thập phân)"
        tests:
          - not_null
      - name: location_name
        description: >
          Tên quận/huyện theo config.json.
          Luôn có giá trị (100% API).
        tests:
          - not_null

  - name: slv_air_quality_hourly
    description: >
      Bảng Silver chứa dữ liệu chất lượng không khí đã bóc tách.
      Gộp 2 nguồn: stg_air_quality_hourly (realtime ~5 ngày) UNION ALL
      stg_historical_air_quality (lịch sử backfill từ 2022).
      unique_key = (forecast_time, latitude, longitude).
    columns:
      - name: forecast_time
        description: "Mốc thời gian dự báo (TIMESTAMPTZ)"
        tests:
          - not_null
      - name: latitude
        description: "Vĩ độ"
        tests:
          - not_null
      - name: longitude
        description: "Kinh độ"
        tests:
          - not_null
      - name: location_name
        description: "Tên quận/huyện."
        tests:
          - not_null
