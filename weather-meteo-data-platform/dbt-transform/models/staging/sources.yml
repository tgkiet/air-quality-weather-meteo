version: 2

sources:
  - name: meteo_bronze
    description: "Lớp dữ liệu thô (Bronze Layer) được lấy từ API Open-Meteo và load vào Postgres bởi Airflow."
    database: air_quality_db
    schema: public

    tables:
      - name: api_openmeteo_raw_data
        description: "Bảng chứa cục JSON raw chưa được xử lý"
        columns:
          - name: id
            description: "Khoá chính tự tăng"
            tests:
              - unique
              - not_null

          - name: source_type
            description: "Đánh dấu dữ liệu thời tiết hay không khí"
            tests:
              - not_null

          - name: execution_date
            description: "Mốc thời gian quy chiếu của batch Airflow (Logical Date)"
            tests:
              - not_null

          - name: raw_json
            description: "Cục JSONB thô"

      - name: bronze_historical_weather
        description: >
          Bảng chứa dữ liệu lịch sử thời tiết và chất lượng không khí từ 3 nguồn:
          (1) CSV Hà Nội 2022-08-02→2025-11-29 (nạp bởi load_historical_csvs.py),
          (2) Archive API backfill HCM 2022-08-02→nay (backfill_history.py --location-prefix HCM),
          (3) Archive API gap fill HN 2025-11-30→nay (backfill_history.py --location-prefix HN).
          UNIQUE CONSTRAINT (datetime, lat, lon) đảm bảo idempotency.
        columns:
          - name: id
            description: "Khoá chính tự tăng"
            tests:
              - unique
              - not_null
          - name: datetime
            description: "Thời gian đo đạc"
            tests:
              - not_null
          - name: lat
            description: "Vĩ độ"
            tests:
              - not_null
          - name: lon
            description: "Kinh độ"
            tests:
              - not_null

